name: setup-node-ci
description: Shared Node.js setup and dependency install for gate workflows
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "20"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
