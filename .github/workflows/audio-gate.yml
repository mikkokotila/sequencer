name: audio-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audio-gate:
    name: audio-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audio:gates
