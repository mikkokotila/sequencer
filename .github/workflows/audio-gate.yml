name: audio-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: audio-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-gate:
    name: audio-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run audio:gates
