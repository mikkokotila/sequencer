name: circular-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  circular-gate:
    name: circular-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run circular
