name: e2e-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-gate:
    name: e2e-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
