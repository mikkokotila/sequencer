name: type-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  type-gate:
    name: type-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
