<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEQUENCER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #18181D;
            --surface: #1e1e24;
            --surface-hi: #25252c;
            --border: #2a2a32;
            --border-hi: #38383f;
            --text: #ddd;
            --text-dim: #999;
            --text-muted: #666;
            --text-faint: #58585F;
            --section-label: #606068;
            --param-value: #ddd;
            --radius: 10px;
            --radius-sm: 5px;
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        #app { padding: 16px 20px 40px; }

        /* ── Transport ── */
        .transport {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3); flex-wrap: wrap;
        }
        .tb { /* shared small button */
            height: 22px; border: 1px solid var(--border-hi); border-radius: var(--radius-sm);
            background: var(--surface-hi); color: var(--text-dim); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; font-family: inherit;
        }
        .tb:hover { background: #222540; border-color: #3a3d58; color: var(--text); }
        .transport-btns { display: flex; gap: 3px; margin-right: 6px; border-right: 1px solid var(--border); padding-right: 10px; }
        .transport-btns .tb { width: 22px; }
        .transport-btns .tb.active {
            background: #14301a; border-color: #256a35; color: #4afe70;
            box-shadow: 0 0 16px rgba(74,254,112,0.15);
        }
        .song-ctrl { display: flex; align-items: center; gap: 4px; }
        .song-name {
            font-size: 10px; font-weight: 600; color: #ddd;
            padding: 2px 8px; height: 22px; display: flex; align-items: center;
            border: 1px solid transparent; border-radius: var(--radius-sm);
            cursor: default; max-width: 160px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
            transition: border-color 0.15s;
        }
        .song-name:hover { border-color: var(--border-hi); }
        .song-name-input {
            font-size: 10px; font-weight: 600; color: #ddd;
            background: var(--surface-hi); border: 1px solid rgba(255,255,255,0.25);
            border-radius: var(--radius-sm); padding: 2px 8px;
            height: 22px; font-family: inherit; outline: none;
            width: 150px;
        }
        .song-btns, .file-btns { display: flex; gap: 3px; }
        .song-btns .tb, .file-btns .tb { width: 22px; }
        .bpm-ctrl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .bpm-ctrl label { color: #777; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
        .bpm-ctrl input[type="range"] { width: 80px; accent-color: #888; cursor: pointer; }
        .bpm-ctrl input[type="number"] {
            width: 46px; background: var(--surface-hi); border: 1px solid var(--border-hi);
            border-radius: var(--radius-sm); color: var(--text); text-align: center;
            padding: 4px 2px; font-size: 12px; font-family: inherit; font-weight: 600;
        }
        .bpm-ctrl input[type="number"]:focus { outline: none; border-color: #388bff; }

        /* ── Section ── */
        .section { margin-bottom: 16px; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .section-header span { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--section-label); }
        .section-header::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent); }
        .bar-labels { display: flex; gap: 6px; margin-left: 190px; margin-bottom: 2px; }
        .bar-label { flex:1; text-align:center; font-size:9px; font-weight:700; color:#666; letter-spacing:1.5px; }

        /* ── Track Info ── */
        .track-info { width:190px; flex-shrink:0; display:flex; align-items:center; gap:5px; padding-right:6px; }
        .track-color { width:3px; height:22px; border-radius:2px; flex-shrink:0; opacity:0.7; }
        .track-name {
            font-weight:400; font-size:10px; min-width:28px; letter-spacing:0.3px;
            color:#999; cursor:default; padding:1px 3px; border-radius:2px;
            border:1px solid transparent; transition:border-color 0.15s;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100px;
        }
        .track-name:hover { border-color: var(--border-hi); }
        .track-name-input {
            font-weight:700; font-size:10px; width:68px; padding:1px 3px;
            border-radius:2px; border:1px solid #388bff; background:var(--surface-hi);
            color:var(--text); font-family:inherit; outline:none;
        }
        .sample-btn {
            font-size:8px; font-weight:600; padding:2px 5px;
            border:1px dashed var(--border-hi); border-radius:3px;
            background:transparent; color:var(--text-muted); cursor:pointer;
            transition:all 0.2s; white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis; max-width:52px; letter-spacing:0.4px;
        }
        .sample-btn:hover { border-color:#4a4d68; color:var(--text-dim); border-style:solid; }
        .sample-btn.loaded { border-color:rgba(255,255,255,0.25); border-style:solid; color:#ccc; background:rgba(255,255,255,0.04); }
        .mute-btn {
            width:18px; height:18px; border:1px solid var(--border); border-radius:3px;
            background:transparent; color:var(--text-muted); cursor:pointer;
            font-size:7px; font-weight:800; display:flex; align-items:center; justify-content:center;
            transition:all 0.15s; flex-shrink:0;
        }
        .mute-btn:hover { border-color:#3a3d58; color:var(--text-dim); }
        .mute-btn.muted { background:rgba(255,60,90,0.12); border-color:rgba(255,60,90,0.4); color:#ff5070; }
        .clear-btn {
            font-size:7px; font-weight:600; padding:2px 4px;
            border:1px solid var(--border); border-radius:3px;
            background:transparent; color:var(--text-muted); cursor:pointer; transition:all 0.15s;
        }
        .clear-btn:hover { border-color:rgba(255,60,90,0.3); color:#ff5070; }
        .fill-btn {
            font-size:7px; font-weight:700; padding:2px 4px; border-radius:3px;
            border:1px solid var(--border); background:transparent;
            color:var(--text-muted); cursor:pointer; transition:all 0.15s; font-family:inherit;
            letter-spacing:0.3px;
        }
        .fill-btn:hover { border-color:rgba(56,139,255,0.4); color:#388bff; background:rgba(56,139,255,0.06); }

        /* ── Grid ── */
        .drum-track,.vocal-track { display:flex; align-items:center; margin-bottom:2px; padding:2px 0; border-radius:var(--radius-sm); transition:background 0.2s; }
        .drum-track.drag-over,.vocal-track.drag-over,.melody-track.drag-over { background:rgba(74,138,254,0.06); }
        .step-grid { display:flex; gap:6px; flex:1; }
        .bar-group { display:flex; gap:1px; flex:1; }
        .step-cell {
            flex:1; min-width:0; height:28px; border-radius:3px; cursor:pointer;
            transition:background 0.08s,box-shadow 0.15s,transform 0.1s; position:relative;
            background:rgba(255,255,255,0.035);
        }
        .step-cell.beat-hi { background:rgba(255,255,255,0.06); }
        .step-cell.beat-gap { margin-left:3px; }
        .step-cell:hover { background:rgba(255,255,255,0.10)!important; }
        .step-cell.playing:not(.active) { background:rgba(255,255,255,0.12)!important; }
        @keyframes hit { 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
        .step-cell.active.playing,.melody-cell.active.playing { animation:hit 0.12s ease-out; }
        .melody-cell.playing:not(.active) { background:rgba(255,255,255,0.12)!important; }

        /* ── Melody Track ── */
        .melody-track {
            margin-bottom:8px; background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius); overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.15);
        }
        .melody-track-header {
            display:flex; align-items:center; gap:5px; padding:5px 10px;
            border-bottom:1px solid var(--border);
        }
        .mono-tag { font-size:7px; font-weight:800; letter-spacing:1px; padding:1px 4px; border-radius:3px; background:rgba(56,139,255,0.15); color:#388bff; }
        .harmony-toggle {
            font-size:7px; font-weight:800; letter-spacing:0.5px; padding:2px 6px; border-radius:3px;
            border:1px solid var(--border-hi); background:var(--surface-hi); color:var(--text-muted);
            cursor:pointer; transition:all 0.15s; font-family:inherit;
        }
        .harmony-toggle:hover { border-color:#3a3d58; color:var(--text-dim); }
        .harmony-toggle.active { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.3); color:#ddd; }
        .harmony-toggle.dimmed { opacity:0.35; }
        .rep-btn {
            font-size:7px; font-weight:800; letter-spacing:0.8px; padding:2px 5px; border-radius:3px;
            border:1px solid var(--border); background:transparent; color:var(--text-muted);
            cursor:default; transition:all 0.15s; opacity:0.3; font-family:inherit;
        }
        .rep-btn.lit { opacity:1; cursor:pointer; background:rgba(56,255,170,0.12); border-color:rgba(56,255,170,0.4); color:#38ffaa; }
        .rep-btn.lit:hover { background:rgba(56,255,170,0.2); }
        .octave-ctrl { display:flex; align-items:center; gap:3px; margin-left:auto; }
        .octave-ctrl label { font-size:8px; font-weight:700; color:var(--text-muted); letter-spacing:1.5px; margin-right:2px; }
        .octave-ctrl button {
            width:18px; height:18px; border:1px solid var(--border-hi); border-radius:3px;
            background:var(--surface-hi); color:var(--text-dim); cursor:pointer;
            display:flex; align-items:center; justify-content:center; font-size:12px; transition:all 0.15s; line-height:1;
        }
        .octave-ctrl button:hover { background:#222540; color:var(--text); }
        .octave-ctrl .oct-val { font-size:12px; font-weight:800; min-width:14px; text-align:center; }
        .melody-grid-wrapper { display:flex; padding:5px 8px; }
        .single-grid-wrapper { padding:5px 8px 5px 28px; }
        .note-labels { display:flex; flex-direction:column; gap:1px; padding-right:4px; }
        .note-label { height:15px; display:flex; align-items:center; justify-content:flex-end; font-size:7px; font-weight:700; color:#666; min-width:16px; padding-right:2px; }
        .note-label.sharp { opacity:0.45; }
        .melody-grid { display:flex; flex-direction:column; gap:1px; flex:1; }
        .melody-row { display:flex; gap:6px; }
        .melody-cell {
            flex:1; min-width:0; height:15px; border-radius:2px; cursor:pointer;
            transition:background 0.06s,box-shadow 0.12s,transform 0.1s; position:relative;
        }
        .melody-cell.white-key { background:rgba(255,255,255,0.038); }
        .melody-cell.black-key { background:rgba(255,255,255,0.020); }
        .melody-cell.beat-hi.white-key { background:rgba(255,255,255,0.058); }
        .melody-cell.beat-hi.black-key { background:rgba(255,255,255,0.035); }
        .melody-cell.beat-gap { margin-left:3px; }
        .melody-cell:hover { background:rgba(255,255,255,0.12)!important; }
        .melody-cell.playing:not(.active) { background:rgba(255,255,255,0.045)!important; }
        .melody-cell.step-selected { outline:1px solid rgba(56,139,255,0.35); outline-offset:-1px; background:rgba(56,139,255,0.08)!important; }
        .melody-cell.step-selected.active { outline-color:rgba(56,139,255,0.5); }

        /* ── Sample Browser Modal ── */
        .browser-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .browser-overlay.open { opacity: 1; pointer-events: all; }
        .browser-panel {
            width: 520px; max-height: 80vh; background: #0d0f1a;
            border: 1px solid var(--border-hi); border-radius: 14px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .browser-header {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px; border-bottom: 1px solid var(--border);
        }
        .browser-title {
            font-size: 13px; font-weight: 800; letter-spacing: 1px; flex: 1;
        }
        .browser-close {
            width: 26px; height: 26px; border-radius: 50%;
            border: 1px solid var(--border-hi); background: transparent;
            color: var(--text-dim); cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .browser-close:hover { background: rgba(255,60,90,0.15); border-color: rgba(255,60,90,0.4); color: #ff5070; }
        .browser-search {
            margin: 10px 18px 0;
            background: var(--surface-hi); border: 1px solid var(--border-hi);
            border-radius: 8px; color: var(--text); padding: 8px 12px;
            font-size: 12px; font-family: inherit; width: calc(100% - 36px);
            outline: none; transition: border-color 0.15s;
        }
        .browser-search:focus { border-color: #388bff; }
        .browser-search::placeholder { color: var(--text-muted); }
        .browser-list {
            flex: 1; overflow-y: auto; padding: 8px 0;
            scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent;
        }
        .browser-group-label {
            font-size: 8px; font-weight: 800; letter-spacing: 2px;
            color: var(--text-muted); padding: 10px 18px 4px;
        }
        .browser-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 18px; cursor: pointer; transition: background 0.1s;
        }
        .browser-item:hover { background: rgba(255,255,255,0.04); }
        .browser-item.selected { background: rgba(56,139,255,0.1); }
        .browser-item-preview {
            width: 22px; height: 22px; border-radius: 50%;
            border: 1px solid var(--border-hi); background: transparent;
            color: var(--text-muted); cursor: pointer; font-size: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; flex-shrink: 0;
        }
        .browser-item-preview:hover { border-color: #4afe70; color: #4afe70; background: rgba(74,254,112,0.08); }
        .browser-item-preview.previewing {
            border-color: #4afe70; color: #4afe70; background: rgba(74,254,112,0.15);
            box-shadow: 0 0 8px rgba(74,254,112,0.2);
        }
        .browser-item-name {
            font-size: 11px; font-weight: 500; color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
        }
        .browser-item-tag {
            font-size: 8px; font-weight: 700; color: var(--text-muted);
            letter-spacing: 0.5px; flex-shrink: 0;
        }
        .browser-footer {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-top: 1px solid var(--border);
        }
        .browser-footer .count { font-size: 10px; color: var(--text-muted); flex: 1; }
        .browser-load-btn {
            padding: 6px 18px; border-radius: 6px;
            border: 1px solid #256a35; background: rgba(74,254,112,0.1);
            color: #4afe70; font-size: 11px; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all 0.15s; letter-spacing: 0.5px;
        }
        .browser-load-btn:hover { background: rgba(74,254,112,0.18); border-color: #38d060; }
        .browser-load-btn:disabled { opacity: 0.3; cursor: default; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:3px; }
        .hint { text-align:center; color:var(--text-muted); font-size:9px; margin-top:12px; letter-spacing:0.5px; }
        .hint kbd { background:var(--surface-hi); border:1px solid var(--border); border-radius:3px; padding:1px 4px; font-size:8px; font-family:inherit; }

        /* ── Song Pane (phrases) ── */
        #song-pane {
            position:fixed; bottom:0; left:0; right:0; height:52px;
            background: #111116; border-top:1px solid #222228;
            display:flex; align-items:center; gap:6px; padding:0 20px; z-index:90;
            transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        body.ext-panel-open #song-pane { right:280px; }
        .phrase-slot {
            flex:1; height:36px; border-radius:5px; cursor:pointer;
            background: rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.06);
            display:flex; align-items:center; justify-content:center; gap:4px;
            transition: all 0.15s; position:relative; min-width:0;
        }
        .phrase-slot:hover { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); }
        .phrase-slot.active { background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.18); }
        .phrase-slot.playing-phrase { box-shadow: 0 0 12px rgba(255,255,255,0.08); }
        .phrase-slot.playing-phrase::after {
            content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px;
            background:rgba(255,255,255,0.5); border-radius:1px;
        }
        .phrase-num { font-size:10px; font-weight:700; color:#555; letter-spacing:0.5px; }
        .phrase-slot.active .phrase-num { color:#999; }
        .phrase-slot.has-content .phrase-num { color:#888; }
        .phrase-dot { width:4px; height:4px; border-radius:50%; background:transparent; flex-shrink:0; }
        .phrase-slot.has-content .phrase-dot { background:rgba(255,255,255,0.35); }
        .phrase-fill-btn {
            position:absolute; top:-1px; right:-1px; width:14px; height:14px;
            border-radius:0 5px 0 3px; border:none; background:rgba(255,255,255,0.06);
            color:#555; font-size:7px; cursor:pointer; display:flex;
            align-items:center; justify-content:center; opacity:0;
            transition: opacity 0.15s;
        }
        .phrase-slot:hover .phrase-fill-btn { opacity:1; }
        .phrase-fill-btn:hover { background:rgba(255,255,255,0.12); color:#999; }

        /* ── Extension Side Panel ── */
        #app { transition: margin-right 0.35s cubic-bezier(0.4, 0, 0.2, 1); padding-bottom: 68px; }
        #app.ext-panel-open { margin-right: 280px; }
        .ext-panel {
            position:fixed; top:0; right:0; bottom:0; width:280px;
            background: linear-gradient(180deg, #1c1c22 0%, #18181D 100%);
            border-left:1px solid var(--border-hi);
            box-shadow: -12px 0 50px rgba(0,0,0,0.5), -2px 0 8px rgba(0,0,0,0.3);
            transform:translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index:900; display:flex; flex-direction:column;
        }
        .ext-panel.open { transform:translateX(0); }
        .ext-panel-header {
            display:flex; align-items:center; gap:10px;
            padding:16px 18px; border-bottom:1px solid var(--border);
            flex-shrink:0;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
        }
        .ext-panel-title {
            font-size:11px; font-weight:800; letter-spacing:2.5px;
            color:#bbb; flex:1;
        }
        .ext-panel-close {
            width:26px; height:26px; border-radius:50%;
            border:1px solid var(--border-hi); background:transparent;
            color:var(--text-dim); cursor:pointer; font-size:14px;
            display:flex; align-items:center; justify-content:center;
            transition:all 0.15s;
        }
        .ext-panel-close:hover { background:rgba(255,60,90,0.15); border-color:rgba(255,60,90,0.4); color:#ff5070; }
        .ext-panel-body { flex:1; padding:20px 18px; overflow-y:auto; }
        .ext-toggle-row {
            display:flex; align-items:center; justify-content:space-between;
            padding:0 0 14px; margin-bottom:14px; border-bottom:1px solid #1e2036;
        }
        .ext-toggle-label { font-size:9px; font-weight:800; letter-spacing:1.5px; color:var(--text-dim); }
        .ext-toggle-label.on { color:#4afe70; }
        .ext-toggle {
            width:36px; height:18px; border-radius:9px; cursor:pointer;
            background:#1e2036; border:1px solid #2e3150; position:relative;
            transition:all 0.25s; flex-shrink:0;
        }
        .ext-toggle::after {
            content:''; position:absolute; top:2px; left:2px;
            width:12px; height:12px; border-radius:50%;
            background:#505478; transition:all 0.25s;
        }
        .ext-toggle.on { background:rgba(74,254,112,0.15); border-color:rgba(74,254,112,0.4); }
        .ext-toggle.on::after { left:20px; background:#4afe70; }
        .ext-icons { display:flex; gap:4px; margin-left:8px; }
        .ext-icon-btn {
            width:30px; height:30px; border:1px solid var(--border-hi);
            border-radius:var(--radius-sm); background:var(--surface-hi);
            color:var(--text-dim); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:all 0.15s; font-family:inherit;
        }
        .ext-icon-btn:hover { background:#222540; border-color:#3a3d58; color:var(--text); }
        .ext-icon-btn.active {
            background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.3); color:#ddd;
            box-shadow:0 0 10px rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="ext-panel" id="ext-panel">
        <div class="ext-panel-header">
            <div class="ext-panel-title" id="ext-panel-title">EXTENSION</div>
            <button class="ext-panel-close" id="ext-panel-close">&times;</button>
        </div>
        <div class="ext-panel-body" id="ext-panel-body"></div>
    </div>
    <div class="browser-overlay" id="browser-overlay">
        <div class="browser-panel">
            <div class="browser-header">
                <div class="browser-title" id="browser-title">Select Sample</div>
                <button class="browser-close" id="browser-close">&times;</button>
            </div>
            <input type="text" class="browser-search" id="browser-search" placeholder="Search samples..." autocomplete="off">
            <div class="browser-list" id="browser-list"></div>
            <div class="browser-footer">
                <div class="count" id="browser-count">0 samples</div>
                <button class="browser-load-btn" id="browser-load" disabled>LOAD</button>
            </div>
        </div>
    </div>
    <script>
    // ═══════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════
    const STEPS = 64, BARS = 4, SPB = 16;
    const DRUMS_CFG = [
        { color:'#F5C04E', bright:'#FFDA6E', idle:'rgba(245,192,78,0.75)',  grid:'rgba(245,192,78,0.14)' },
        { color:'#EEA83E', bright:'#FFC258', idle:'rgba(238,168,62,0.70)',  grid:'rgba(238,168,62,0.12)' },
        { color:'#E49432', bright:'#F8AE4C', idle:'rgba(228,148,50,0.65)', grid:'rgba(228,148,50,0.11)' },
        { color:'#DA822A', bright:'#EE9C44', idle:'rgba(218,130,42,0.60)', grid:'rgba(218,130,42,0.10)' },
        { color:'#D07224', bright:'#E48C3E', idle:'rgba(208,114,36,0.55)', grid:'rgba(208,114,36,0.09)' },
    ];
    const MEL_CFG = [
        { color:'#A0B4FF', bright:'#BCC8FF', idle:'rgba(160,180,255,0.70)', grid:'rgba(160,180,255,0.10)', mono:true },
        { color:'#8C9CF0', bright:'#A8B4FF', idle:'rgba(140,156,240,0.62)', grid:'rgba(140,156,240,0.09)', mono:false },
        { color:'#7C8AE2', bright:'#96A2F6', idle:'rgba(124,138,226,0.55)', grid:'rgba(124,138,226,0.08)', mono:false },
    ];
    const VOCAL_CFG = { color:'#5CDCC8', bright:'#7AEEDA', idle:'rgba(92,220,200,0.70)', grid:'rgba(92,220,200,0.11)' };
    const NOTES_DISPLAY = ['B','A#','A','G#','G','F#','F','E','D#','D','C#','C'];
    const SHARPS = new Set([1,3,6,8,10]);
    const DEFAULT_DRUM_NAMES = ['Kick','Snare','Closed Hat','Open Hat','Crash'];
    const DEFAULT_MEL_NAMES  = ['Mono Synth','Poly Synth 1','Poly Synth 2'];
    const DEFAULT_VOCAL_NAME = 'Sample 1';
    const HARMONY_LABELS = ['—','5TH','7TH','OCT'];
    const HARMONY_SEMITONES = [0, 7, 10, 12];

    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    let audioCtx = null, bpm = 120, playing = false, curStep = 0, nextTime = 0, timer = null, prevVisualStep = -1;
    let drumNames = [...DEFAULT_DRUM_NAMES], melNames = [...DEFAULT_MEL_NAMES], vocalName = DEFAULT_VOCAL_NAME;
    // ── Phrases (12 phrases, each 4 bars / 64 steps) ──
    const NUM_PHRASES = 12;
    function makeEmptyPhrase() {
        return {
            drumPat: DRUMS_CFG.map(() => Array(STEPS).fill(false)),
            melPat: MEL_CFG.map(() => Array.from({length:STEPS}, () => Array(12).fill(false))),
            vocalPat: Array(STEPS).fill(false)
        };
    }
    const phrases = Array.from({length:NUM_PHRASES}, ()=>makeEmptyPhrase());
    let currentPhrase = 0, playingPhrase = 0;
    // Active pattern references (point to current phrase)
    let drumPat = phrases[0].drumPat;
    let melPat = phrases[0].melPat;
    let vocalPat = phrases[0].vocalPat;
    const octaves = [3,3,3], harmonies = [0,0,0];
    const drumBuf = Array(DRUMS_CFG.length).fill(null), melBuf = Array(MEL_CFG.length).fill(null);
    let vocalBuf = null;
    const mutedArr = Array(DRUMS_CFG.length + MEL_CFG.length + 1).fill(false);
    const drumSampleData = Array(DRUMS_CFG.length).fill(null), melSampleData = Array(MEL_CFG.length).fill(null);
    let vocalSampleData = null;
    // Default pattern (phrase 0 only)
    phrases[0].drumPat[0][0]=phrases[0].drumPat[0][4]=phrases[0].drumPat[0][8]=phrases[0].drumPat[0][12]=true;
    phrases[0].melPat[0][0][0]=true; phrases[0].melPat[0][4][4]=true; phrases[0].melPat[0][8][7]=true;
    let painting=false, paintVal=true, paintType='';
    let selecting=false, selection={track:-1,start:-1,end:-1};
    const drumCells=[], melCells=[];
    let vocalCells=[];
    let db=null, currentSongId=null, currentSongName='Untitled', saveTimer=null;
    let sampleManifest = null;
    let masterGain = null;
    const trackGains = []; // per-track gain nodes: [drum0..4, mel0..2, vocal]
    const TOTAL_TRACKS = DRUMS_CFG.length + MEL_CFG.length + 1;

    // ═══════════════════════════════════════════
    //  EXTENSION API
    // ═══════════════════════════════════════════
    const SEQ_EXTENSIONS = [];
    let activeExtensionId = null;

    const seqStopCallbacks = [];

    window.SEQ = {
        register(ext) { SEQ_EXTENSIONS.push(ext); },
        get audioContext() { return audioCtx; },
        get masterGain() { return masterGain; },
        get trackGains() { return trackGains; },
        get trackCount() { return TOTAL_TRACKS; },
        get playing() { return playing; },
        onStop(fn) { seqStopCallbacks.push(fn); },
        getTrackInfo(i) {
            if (i < DRUMS_CFG.length) { const c=DRUMS_CFG[i]; return { name: drumNames[i], color: c.color, bright: c.bright, type: 'drum' }; }
            const mi = i - DRUMS_CFG.length;
            if (mi < MEL_CFG.length) { const c=MEL_CFG[mi]; return { name: melNames[mi], color: c.color, bright: c.bright, type: 'melody' }; }
            return { name: vocalName, color: VOCAL_CFG.color, bright: VOCAL_CFG.bright, type: 'vocal' };
        },
        rebuildChain() { rebuildAudioChain(); },
        notifyStateChange() { scheduleSave(); },
    };

    function rebuildAudioChain() {
        if (!masterGain) return;
        masterGain.disconnect();
        if (SEQ_EXTENSIONS.length === 0) { masterGain.connect(audioCtx.destination); return; }
        SEQ_EXTENSIONS.forEach(ext => { if (!ext._nodes) ext._nodes = ext.init(audioCtx); });
        let prev = masterGain;
        SEQ_EXTENSIONS.forEach(ext => {
            try { ext._nodes.output.disconnect(); } catch(e) {}
            prev.connect(ext._nodes.input);
            prev = ext._nodes.output;
        });
        prev.connect(audioCtx.destination);
    }

    function toggleExtension(extId) {
        const panel = document.getElementById('ext-panel');
        const body = document.getElementById('ext-panel-body');
        const title = document.getElementById('ext-panel-title');
        const app = document.getElementById('app');
        if (activeExtensionId === extId) {
            panel.classList.remove('open'); app.classList.remove('ext-panel-open'); document.body.classList.remove('ext-panel-open');
            activeExtensionId = null; updateExtIcons(); return;
        }
        const ext = SEQ_EXTENSIONS.find(e => e.id === extId);
        if (!ext) return;
        title.textContent = ext.name.toUpperCase();
        body.innerHTML = '';
        // Build extension UI first into a wrapper
        const extContent = el('div','');
        ext.createUI(extContent);
        // On/off toggle (prepended above extension content)
        const toggleRow = el('div','ext-toggle-row');
        const toggleLabel = el('div','ext-toggle-label');
        const isOn = ext._enabled || false;
        toggleLabel.textContent = isOn ? 'ON' : 'OFF';
        if (isOn) toggleLabel.classList.add('on');
        const toggle = el('div','ext-toggle');
        if (isOn) toggle.classList.add('on');
        toggle.onclick = () => {
            ext._enabled = !ext._enabled;
            toggle.classList.toggle('on', ext._enabled);
            toggleLabel.textContent = ext._enabled ? 'ON' : 'OFF';
            toggleLabel.classList.toggle('on', ext._enabled);
            if (ext.setEnabled) ext.setEnabled(ext._enabled);
            scheduleSave();
        };
        toggleRow.appendChild(toggleLabel);
        toggleRow.appendChild(toggle);
        body.appendChild(toggleRow);
        body.appendChild(extContent);
        panel.classList.add('open'); app.classList.add('ext-panel-open'); document.body.classList.add('ext-panel-open');
        activeExtensionId = extId; updateExtIcons();
    }

    function updateExtIcons() {
        document.querySelectorAll('.ext-icon-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.extId === activeExtensionId);
        });
    }

    function buildExtIcons() {
        const container = document.getElementById('ext-icons');
        if (!container) return;
        container.innerHTML = '';
        SEQ_EXTENSIONS.forEach(ext => {
            const btn = el('button', 'ext-icon-btn');
            btn.dataset.extId = ext.id;
            btn.innerHTML = ext.icon;
            btn.title = ext.name;
            btn.onclick = () => toggleExtension(ext.id);
            container.appendChild(btn);
        });
    }

    // ═══════════════════════════════════════════
    //  SAMPLE BROWSER STATE
    // ═══════════════════════════════════════════
    let browserType = '';   // 'drum','melody','vocal'
    let browserIdx = 0;
    let browserItems = [];  // {name, path, group}
    let browserSelected = null; // index
    let browserPreviewBuf = null;
    let previewingIdx = -1;

    // ═══════════════════════════════════════════
    //  HELPERS
    // ═══════════════════════════════════════════
    function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
    function hexToRgba(hex,a){return`rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;}
    function displayToSemitone(d){return 11-d;}
    function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
    function truncName(n){return n.length>6?n.slice(0,5)+'\u2026':n;}

    // ═══════════════════════════════════════════
    //  INDEXEDDB
    // ═══════════════════════════════════════════
    function openDB(){
        return new Promise((resolve,reject)=>{
            const req=indexedDB.open('sequencer-db',1);
            req.onupgradeneeded=(e)=>{const d=e.target.result;if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');};
            req.onsuccess=()=>{db=req.result;resolve(db);};
            req.onerror=()=>reject(req.error);
        });
    }
    function dbPut(store,val,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const s=tx.objectStore(store);const r=key!==undefined?s.put(val,key):s.put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
    function dbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
    function dbGetAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
    function dbDelete(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}

    // ═══════════════════════════════════════════
    //  SONG PERSISTENCE
    // ═══════════════════════════════════════════
    function collectSongData(name){
        return {id:currentSongId||genId(),name:name||'Untitled',bpm,
            phrases: phrases.map(p=>({
                drumPat:p.drumPat.map(r=>[...r]),
                melPat:p.melPat.map(t=>t.map(s=>[...s])),
                vocalPat:[...p.vocalPat]
            })),
            currentPhrase,
            octaves:[...octaves],harmonies:[...harmonies],
            drumNames:[...drumNames],melNames:[...melNames],vocalName,mutedArr:[...mutedArr],
            drumSampleData:drumSampleData.map(d=>d?{name:d.name,data:d.data}:null),
            melSampleData:melSampleData.map(d=>d?{name:d.name,data:d.data}:null),
            vocalSampleData:vocalSampleData?{name:vocalSampleData.name,data:vocalSampleData.data}:null,
            extensions: SEQ_EXTENSIONS.reduce((o,ext)=>{const s=ext.getState();s._enabled=!!ext._enabled;o[ext.id]=s;return o;},{}),
            updatedAt:Date.now()};
    }
    async function saveSong(){
        if(!db||!currentSongId)return;
        const data=collectSongData(currentSongName);data.id=currentSongId;
        await dbPut('songs',data);await dbPut('meta',currentSongId,'currentSongId');
    }
    function scheduleSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveSong(),500);}

    async function loadSong(song){
        bpm=song.bpm||120;
        // Load phrases (backward-compat: old songs have flat drumPat/melPat/vocalPat)
        for(let pi=0;pi<NUM_PHRASES;pi++){
            const sp=song.phrases&&song.phrases[pi]; const p=phrases[pi];
            const sd=sp?sp.drumPat:pi===0?song.drumPat:null;
            const sm=sp?sp.melPat:pi===0?song.melPat:null;
            const sv=sp?sp.vocalPat:pi===0?song.vocalPat:null;
            for(let t=0;t<DRUMS_CFG.length;t++)for(let s=0;s<STEPS;s++)p.drumPat[t][s]=!!(sd&&sd[t]&&sd[t][s]);
            for(let t=0;t<MEL_CFG.length;t++)for(let s=0;s<STEPS;s++)for(let n=0;n<12;n++)p.melPat[t][s][n]=!!(sm&&sm[t]&&sm[t][s]&&sm[t][s][n]);
            for(let s=0;s<STEPS;s++)p.vocalPat[s]=!!(sv&&sv[s]);
        }
        currentPhrase=song.currentPhrase||0;
        drumPat=phrases[currentPhrase].drumPat;melPat=phrases[currentPhrase].melPat;vocalPat=phrases[currentPhrase].vocalPat;
        for(let t=0;t<MEL_CFG.length;t++){octaves[t]=(song.octaves&&song.octaves[t])||3;harmonies[t]=(song.harmonies&&song.harmonies[t])||0;}
        drumNames=song.drumNames||[...DEFAULT_DRUM_NAMES];melNames=song.melNames||[...DEFAULT_MEL_NAMES];vocalName=song.vocalName||DEFAULT_VOCAL_NAME;
        for(let i=0;i<mutedArr.length;i++)mutedArr[i]=!!(song.mutedArr&&song.mutedArr[i]);
        initAudio();
        for(let t=0;t<DRUMS_CFG.length;t++){const sd=song.drumSampleData&&song.drumSampleData[t];if(sd&&sd.data){drumSampleData[t]=sd;try{drumBuf[t]=await audioCtx.decodeAudioData(sd.data.slice(0));}catch(e){drumBuf[t]=null;}}else{drumBuf[t]=null;drumSampleData[t]=null;}}
        for(let t=0;t<MEL_CFG.length;t++){const sd=song.melSampleData&&song.melSampleData[t];if(sd&&sd.data){melSampleData[t]=sd;try{melBuf[t]=await audioCtx.decodeAudioData(sd.data.slice(0));}catch(e){melBuf[t]=null;}}else{melBuf[t]=null;melSampleData[t]=null;}}
        const vsd=song.vocalSampleData;if(vsd&&vsd.data){vocalSampleData=vsd;try{vocalBuf=await audioCtx.decodeAudioData(vsd.data.slice(0));}catch(e){vocalBuf=null;}}else{vocalBuf=null;vocalSampleData=null;}
        // Restore extension states
        if (song.extensions) SEQ_EXTENSIONS.forEach(ext => { if (song.extensions[ext.id]) { const s=song.extensions[ext.id]; ext.setState(s); ext._enabled=!!s._enabled; if(ext.setEnabled)ext.setEnabled(ext._enabled); } });
        currentSongId=song.id;
        currentSongName=song.name||'Untitled';
    }

    function refreshUI(){
        for(let t=0;t<DRUMS_CFG.length;t++)for(let s=0;s<STEPS;s++)updateDrumCell(t,s);
        for(let t=0;t<MEL_CFG.length;t++)for(let s=0;s<STEPS;s++)for(let d=0;d<12;d++)updateMelCell(t,s,d);
        for(let s=0;s<STEPS;s++)updateVocalCell(s);
        document.querySelectorAll('.melody-track[data-type="drum"]').forEach((row,ti)=>{
            const n=row.querySelector('.track-name');if(n)n.textContent=drumNames[ti];
            const sb=row.querySelector('.sample-btn');
            if(sb){if(drumSampleData[ti]){sb.textContent=truncName(drumSampleData[ti].name);sb.classList.add('loaded');sb.title=drumSampleData[ti].name;}else{sb.textContent='LOAD';sb.classList.remove('loaded');sb.title='';}}
            const mb=row.querySelector('.mute-btn');if(mb)mb.classList.toggle('muted',mutedArr[ti]);
        });
        document.querySelectorAll('.melody-track[data-type="melody"]').forEach((panel,ti)=>{
            const n=panel.querySelector('.track-name');if(n)n.textContent=melNames[ti];
            const ov=panel.querySelector('.oct-val');if(ov)ov.textContent=octaves[ti];
            const sb=panel.querySelector('.sample-btn');
            if(sb){if(melSampleData[ti]){sb.textContent=truncName(melSampleData[ti].name);sb.classList.add('loaded');sb.title=melSampleData[ti].name;}else{sb.textContent='LOAD';sb.classList.remove('loaded');sb.title='';}}
            const mb=panel.querySelector('.mute-btn');if(mb)mb.classList.toggle('muted',mutedArr[DRUMS_CFG.length+ti]);
            const ht=panel.querySelector('.harmony-toggle');
            if(ht){ht.textContent='HARM: '+HARMONY_LABELS[harmonies[ti]];ht.classList.toggle('active',harmonies[ti]>0);updateHarmonyDim(ti);}
        });
        const vrow=document.querySelector('.melody-track[data-type="vocal"]');
        if(vrow){const n=vrow.querySelector('.track-name');if(n)n.textContent=vocalName;const sb=vrow.querySelector('.sample-btn');if(sb){if(vocalSampleData){sb.textContent=truncName(vocalSampleData.name);sb.classList.add('loaded');sb.title=vocalSampleData.name;}else{sb.textContent='LOAD';sb.classList.remove('loaded');sb.title='';}}const mb=vrow.querySelector('.mute-btn');if(mb)mb.classList.toggle('muted',mutedArr[DRUMS_CFG.length+MEL_CFG.length]);}
        const br=document.getElementById('bpm-range'),bn=document.getElementById('bpm-num');
        if(br)br.value=bpm;if(bn)bn.value=bpm;
    }

    // ═══════════════════════════════════════════
    //  AUDIO ENGINE
    // ═══════════════════════════════════════════
    function initAudio(){
        if(!audioCtx){
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            masterGain=audioCtx.createGain();
            masterGain.gain.value=0.8; // headroom for summing
            masterGain.connect(audioCtx.destination);
            // Create per-track gain nodes
            for(let i=0;i<TOTAL_TRACKS;i++){const g=audioCtx.createGain();g.connect(masterGain);trackGains.push(g);}
        }
        if(audioCtx.state==='suspended')audioCtx.resume();
    }
    async function loadAudioFile(file){initAudio();const ab=await file.arrayBuffer();return{buffer:await audioCtx.decodeAudioData(ab.slice(0)),data:ab,name:file.name};}
    let previewSource = null;
    function playSample(buffer,time,rate,dest){if(!buffer||!audioCtx)return;const src=audioCtx.createBufferSource();src.buffer=buffer;if(rate!==undefined)src.playbackRate.value=rate;src.connect(dest||masterGain);src.start(time);return src;}
    function playPreviewSample(buffer,rate){
        // Soft cutoff of previous preview
        if(previewSource){try{previewSource.stop();}catch(e){}}
        const src=playSample(buffer,audioCtx.currentTime,rate);
        if(src){previewSource=src;src.onended=()=>{if(previewSource===src)previewSource=null;};}
    }

    async function fetchAndDecode(url){
        initAudio();
        const resp = await fetch(url);
        if(!resp.ok) throw new Error('fetch failed: '+resp.status);
        const ab = await resp.arrayBuffer();
        const buf = await audioCtx.decodeAudioData(ab.slice(0));
        return { buffer: buf, data: ab };
    }

    // ═══════════════════════════════════════════
    //  SCHEDULER
    // ═══════════════════════════════════════════
    function isPhraseEmpty(idx){
        const p=phrases[idx];
        for(let t=0;t<DRUMS_CFG.length;t++)for(let s=0;s<STEPS;s++)if(p.drumPat[t][s])return false;
        for(let t=0;t<MEL_CFG.length;t++)for(let s=0;s<STEPS;s++)for(let n=0;n<12;n++)if(p.melPat[t][s][n])return false;
        for(let s=0;s<STEPS;s++)if(p.vocalPat[s])return false;
        return true;
    }
    function findNextPhrase(fromIdx){
        for(let i=1;i<=NUM_PHRASES;i++){const idx=(fromIdx+i)%NUM_PHRASES;if(!isPhraseEmpty(idx))return idx;}
        return -1; // all empty
    }
    function findFirstNonEmpty(){
        for(let i=0;i<NUM_PHRASES;i++)if(!isPhraseEmpty(i))return i;
        return 0;
    }
    function switchToPhrase(idx){
        currentPhrase=idx;
        drumPat=phrases[idx].drumPat; melPat=phrases[idx].melPat; vocalPat=phrases[idx].vocalPat;
        refreshUI(); updateSongPane();
    }
    function fillWithPrev(idx){
        if(idx<=0)return;
        const prev=phrases[idx-1],cur=phrases[idx];
        for(let t=0;t<DRUMS_CFG.length;t++)for(let s=0;s<STEPS;s++)cur.drumPat[t][s]=prev.drumPat[t][s];
        for(let t=0;t<MEL_CFG.length;t++)for(let s=0;s<STEPS;s++)for(let n=0;n<12;n++)cur.melPat[t][s][n]=prev.melPat[t][s][n];
        for(let s=0;s<STEPS;s++)cur.vocalPat[s]=prev.vocalPat[s];
        if(currentPhrase===idx){drumPat=cur.drumPat;melPat=cur.melPat;vocalPat=cur.vocalPat;refreshUI();}
        updateSongPane(); scheduleSave();
    }
    function advancePhrase(){
        const next=findNextPhrase(playingPhrase);
        if(next<0){stopPlayback();return;}
        playingPhrase=next; updateSongPane();
    }
    function scheduler(){
        while(nextTime<audioCtx.currentTime+0.1){
            scheduleStep(curStep,nextTime);
            nextTime+=(60/bpm)/4;
            curStep++;
            if(curStep>=STEPS){curStep=0;advancePhrase();}
        }
    }
    function scheduleStep(s,time){
        // Read from the PLAYING phrase, not the editing phrase
        const pd=phrases[playingPhrase].drumPat, pm=phrases[playingPhrase].melPat, pv=phrases[playingPhrase].vocalPat;
        for(let t=0;t<DRUMS_CFG.length;t++)if(pd[t][s]&&drumBuf[t]&&!mutedArr[t])playSample(drumBuf[t],time,undefined,trackGains[t]);
        for(let t=0;t<MEL_CFG.length;t++){
            if(!melBuf[t]||mutedArr[DRUMS_CFG.length+t])continue;
            const dest=trackGains[DRUMS_CFG.length+t];
            const an=[];for(let n=0;n<12;n++)if(pm[t][s][n])an.push(n);
            for(const n of an){playSample(melBuf[t],time,Math.pow(2,((octaves[t]-1)*12+n)/12),dest);
                if(an.length===1&&!MEL_CFG[t].mono&&harmonies[t]>0)playSample(melBuf[t],time,Math.pow(2,((octaves[t]-1)*12+n+HARMONY_SEMITONES[harmonies[t]])/12),dest);}
        }
        if(pv[s]&&vocalBuf&&!mutedArr[DRUMS_CFG.length+MEL_CFG.length])playSample(vocalBuf,time,undefined,trackGains[DRUMS_CFG.length+MEL_CFG.length]);
        const delay=Math.max(0,(time-audioCtx.currentTime)*1000);setTimeout(()=>highlightStep(s),delay);
    }
    function highlightStep(s){
        // Only show playhead in grid if we're viewing the playing phrase
        if(playingPhrase!==currentPhrase){prevVisualStep=-1;return;}
        if(prevVisualStep>=0)clearHL(prevVisualStep);
        for(let t=0;t<DRUMS_CFG.length;t++){const c=drumCells[t][s];c.classList.add('playing');if(drumPat[t][s]){c.style.background=DRUMS_CFG[t].bright;c.style.boxShadow=`0 0 16px ${DRUMS_CFG[t].bright}80, 0 0 6px ${DRUMS_CFG[t].color}60`;}}
        for(let t=0;t<MEL_CFG.length;t++)for(let n=0;n<12;n++){const c=melCells[t][s][n];c.classList.add('playing');const semi=displayToSemitone(n);if(melPat[t][s][semi]){c.style.background=MEL_CFG[t].bright;c.style.boxShadow=`0 0 16px ${MEL_CFG[t].bright}80, 0 0 6px ${MEL_CFG[t].color}60`;}}
        vocalCells[s].classList.add('playing');if(vocalPat[s]){vocalCells[s].style.background=VOCAL_CFG.bright;vocalCells[s].style.boxShadow=`0 0 16px ${VOCAL_CFG.bright}80, 0 0 6px ${VOCAL_CFG.color}60`;}
        prevVisualStep=s;
    }
    function clearHL(s){
        for(let t=0;t<DRUMS_CFG.length;t++){const c=drumCells[t][s];c.classList.remove('playing');if(drumPat[t][s]){c.style.background=DRUMS_CFG[t].idle;c.style.boxShadow='';}else{c.style.background='';c.style.boxShadow='';}}
        for(let t=0;t<MEL_CFG.length;t++)for(let n=0;n<12;n++){const c=melCells[t][s][n];c.classList.remove('playing');const semi=displayToSemitone(n);if(melPat[t][s][semi]){c.style.background=MEL_CFG[t].idle;c.style.boxShadow='';}else{c.style.background='';c.style.boxShadow='';}}
        vocalCells[s].classList.remove('playing');if(vocalPat[s]){vocalCells[s].style.background=VOCAL_CFG.idle;vocalCells[s].style.boxShadow='';}else{vocalCells[s].style.background='';vocalCells[s].style.boxShadow='';}
    }
