    //  CELL VISUALS
    // ═══════════════════════════════════════════
    function updateDrumCell(t,s){const c=drumCells[t][s];const cfg=DRUMS_CFG[t];if(drumPat[t][s]){c.classList.add('active');c.style.background=cfg.idle;c.style.boxShadow='';}else{c.classList.remove('active');c.style.background='';c.style.boxShadow='';}}
    function updateMelCell(t,s,dr){const semi=displayToSemitone(dr);const c=melCells[t][s][dr];const cfg=MEL_CFG[t];if(melPat[t][s][semi]){c.classList.add('active');c.style.background=cfg.idle;c.style.boxShadow='';}else{c.classList.remove('active');c.style.background='';c.style.boxShadow='';}}
    function updateVocalCell(s){const c=vocalCells[s];if(vocalPat[s]){c.classList.add('active');c.style.background=VOCAL_CFG.idle;c.style.boxShadow='';}else{c.classList.remove('active');c.style.background='';c.style.boxShadow='';}}
    function setMelodyCell(t,s,dr,val){const semi=displayToSemitone(dr);if(MEL_CFG[t].mono&&val){for(let n=0;n<12;n++){if(n!==semi&&melPat[t][s][n]){melPat[t][s][n]=false;updateMelCell(t,s,11-n);}}}melPat[t][s][semi]=val;updateMelCell(t,s,dr);if(!MEL_CFG[t].mono)updateHarmonyDim(t);}

    // Harmony
    function checkMultiNote(t){for(let s=0;s<STEPS;s++){let c=0;for(let n=0;n<12;n++)if(melPat[t][s][n])c++;if(c>1)return true;}return false;}
    function updateHarmonyDim(t){const b=document.querySelector(`.melody-track[data-track="${t}"] .harmony-toggle`);if(b)b.classList.toggle('dimmed',checkMultiNote(t));}
    function cycleHarmony(t){harmonies[t]=(harmonies[t]+1)%HARMONY_LABELS.length;const b=document.querySelector(`.melody-track[data-track="${t}"] .harmony-toggle`);if(b){b.textContent='HARM: '+HARMONY_LABELS[harmonies[t]];b.classList.toggle('active',harmonies[t]>0);}scheduleSave();}

    // Selection
    function updateSelectionVisuals(){document.querySelectorAll('.step-selected').forEach(c=>c.classList.remove('step-selected'));if(selection.track<0)return;const lo=Math.min(selection.start,selection.end),hi=Math.max(selection.start,selection.end);for(let s=lo;s<=hi;s++)for(let d=0;d<12;d++)melCells[selection.track][s][d].classList.add('step-selected');updateRepButtons();}
    function updateRepButtons(){document.querySelectorAll('.rep-btn').forEach(b=>{const t=+b.dataset.track;b.classList.toggle('lit',selection.track===t&&selection.start>=0&&selection.start!==selection.end);});}
    function clearSelection(){selection={track:-1,start:-1,end:-1};updateSelectionVisuals();}
    function replicateSelection(t){const lo=Math.min(selection.start,selection.end),hi=Math.max(selection.start,selection.end);if(lo<0||lo===hi)return;const len=hi-lo+1;const pat=[];for(let s=lo;s<=hi;s++)pat.push([...melPat[t][s]]);for(let s=hi+1;s<STEPS;s++){const pi=(s-hi-1)%len;melPat[t][s]=[...pat[pi]];}for(let s=hi+1;s<STEPS;s++)for(let d=0;d<12;d++)updateMelCell(t,s,d);clearSelection();scheduleSave();}

    // Track-level replicate: detect pattern, tile to fill entire track
    function replicateTrack(type, idx) {
        // Find last step with content
        let lastStep = -1;
        for (let s = STEPS - 1; s >= 0; s--) {
            if (type === 'drum' && drumPat[idx][s]) { lastStep = s; break; }
            if (type === 'melody' && melPat[idx][s].some(n => n)) { lastStep = s; break; }
            if (type === 'vocal' && vocalPat[s]) { lastStep = s; break; }
        }
        if (lastStep < 0) return; // nothing to replicate

        // Snap pattern length to bar boundary
        const patLen = (Math.floor(lastStep / SPB) + 1) * SPB;
        if (patLen >= STEPS) return; // already fills entire track

        // Tile from patLen to end
        for (let s = patLen; s < STEPS; s++) {
            const src = s % patLen;
            if (type === 'drum') {
                drumPat[idx][s] = drumPat[idx][src];
                updateDrumCell(idx, s);
            } else if (type === 'melody') {
                melPat[idx][s] = [...melPat[idx][src]];
                for (let d = 0; d < 12; d++) updateMelCell(idx, s, d);
            } else {
                vocalPat[s] = vocalPat[src];
                updateVocalCell(s);
            }
        }
        scheduleSave();
    }

    // ═══════════════════════════════════════════
    //  SAMPLE BROWSER
    // ═══════════════════════════════════════════
    async function loadManifest(){
        try {
            const r = await fetch('samples.json');
            sampleManifest = await r.json();
        } catch(e) { console.warn('No samples.json found — browser will use file picker fallback'); }
    }

    function prettySynthName(filename) {
        let n = filename.replace(/\.wav$/i, '');
        n = n.replace(/\s*C1$/i, '');
        return n;
    }
    function prettyDrumName(filename) {
        return filename.replace(/\.wav$/i, '');
    }

    function openBrowser(type, idx) {
        if (!sampleManifest) { loadSampleFallback(type, idx); return; }
        browserType = type; browserIdx = idx; browserSelected = null; previewingIdx = -1;
        browserItems = [];

        if (type === 'drum') {
            const keys = ['kick','snare','ch','oh','crash'];
            const key = keys[idx];
            const entry = sampleManifest[key];
            if (!entry) { loadSampleFallback(type, idx); return; }
            entry.files.forEach(f => {
                browserItems.push({ name: prettyDrumName(f), path: entry.path + '/' + encodeURIComponent(f), group: '' });
            });
            // Group by prefix (machine name)
            const groups = {};
            browserItems.forEach(item => {
                const parts = item.name.split(' ');
                const g = parts.length >= 3 ? parts.slice(0, 2).join(' ') : parts[0];
                if (!groups[g]) groups[g] = [];
                groups[g].push(item);
            });
            browserItems = [];
            Object.keys(groups).sort().forEach(g => {
                groups[g].forEach(item => { item.group = g; browserItems.push(item); });
            });
        } else if (type === 'melody' || type === 'vocal') {
            const synths = sampleManifest.synths;
            if (!synths) { loadSampleFallback(type, idx); return; }
            Object.keys(synths.groups).sort().forEach(group => {
                synths.groups[group].forEach(f => {
                    browserItems.push({
                        name: prettySynthName(f),
                        path: synths.basePath + '/' + encodeURIComponent(group) + '/' + encodeURIComponent(f),
                        group: group
                    });
                });
            });
        }

        document.getElementById('browser-title').textContent =
            type === 'drum' ? drumNames[idx] + ' — Select Sample' :
            type === 'melody' ? melNames[idx] + ' — Select Sample' :
            'Vocal — Select Sample';
        document.getElementById('browser-search').value = '';
        renderBrowserList('');
        const overlay = document.getElementById('browser-overlay');
        overlay.classList.add('open');
        setTimeout(() => document.getElementById('browser-search').focus(), 50);
    }

    function closeBrowser() {
        document.getElementById('browser-overlay').classList.remove('open');
        previewingIdx = -1;
    }

    function renderBrowserList(filter) {
        const list = document.getElementById('browser-list');
        list.innerHTML = '';
        const lf = filter.toLowerCase();
        let lastGroup = '';
        let count = 0;

        browserItems.forEach((item, i) => {
            if (lf && !item.name.toLowerCase().includes(lf) && !item.group.toLowerCase().includes(lf)) return;
            // Group header
            if (item.group !== lastGroup) {
                lastGroup = item.group;
                const gl = el('div', 'browser-group-label');
                gl.textContent = item.group.toUpperCase();
                list.appendChild(gl);
            }
            const row = el('div', 'browser-item');
            if (browserSelected === i) row.classList.add('selected');
            row.dataset.index = i;

            const prev = el('button', 'browser-item-preview');
            prev.innerHTML = '&#9654;';
            prev.title = 'Preview';
            if (previewingIdx === i) prev.classList.add('previewing');
            prev.onclick = (e) => { e.stopPropagation(); previewSample(i); };
            prev.ondblclick = (e) => { e.stopPropagation(); previewSample(i); }; // prevent row dblclick

            const nameSpan = el('div', 'browser-item-name');
            nameSpan.textContent = item.name;

            row.appendChild(prev);
            row.appendChild(nameSpan);
            row.onclick = (e) => { if (!e.target.closest('.browser-item-preview')) selectBrowserItem(i); };
            row.ondblclick = (e) => { if (!e.target.closest('.browser-item-preview')) { selectBrowserItem(i); confirmBrowserLoad(); } };
            list.appendChild(row);
            count++;
        });

        document.getElementById('browser-count').textContent = count + ' sample' + (count !== 1 ? 's' : '');
        document.getElementById('browser-load').disabled = browserSelected === null;
    }

    function selectBrowserItem(i) {
        browserSelected = i;
        document.querySelectorAll('.browser-item').forEach(r => {
            r.classList.toggle('selected', +r.dataset.index === i);
        });
        document.getElementById('browser-load').disabled = false;
    }

    async function previewSample(i) {
        const item = browserItems[i];
        if (!item) return;
        initAudio();

        const hasContent = trackHasContent(browserType, browserIdx);
        const isSequenceMode = playing && hasContent;

        // In sequence mode, clicking same item toggles the swap off
        if (isSequenceMode && previewingIdx === i) {
            previewingIdx = -1;
            restoreOriginalBuffer();
            document.querySelectorAll('.browser-item-preview').forEach(b => b.classList.remove('previewing'));
            return;
        }

        previewingIdx = i;
        document.querySelectorAll('.browser-item-preview').forEach(b => b.classList.remove('previewing'));
        const btn = document.querySelector(`.browser-item[data-index="${i}"] .browser-item-preview`);
        if (btn) btn.classList.add('previewing');

        try {
            // Cache decoded buffer if same item, else fetch fresh
            let buffer;
            if (browserPreviewBuf && browserPreviewBuf._idx === i) {
                buffer = browserPreviewBuf;
            } else {
                const result = await fetchAndDecode(item.path);
                buffer = result.buffer;
                buffer._idx = i;
                browserPreviewBuf = buffer;
            }

            if (isSequenceMode) {
                // Swap buffer so the playing sequence uses this sound
                if (browserType === 'drum') drumBuf[browserIdx] = buffer;
                else if (browserType === 'melody') melBuf[browserIdx] = buffer;
                else vocalBuf = buffer;
            } else {
                // Simple playback: always play on click (repeatable), soft cutoff previous
                playPreviewSample(buffer, browserType === 'melody' ? 1 : undefined);
            }
        } catch(e) { console.error('Preview failed:', e); }

        selectBrowserItem(i);
    }

    function trackHasContent(type, idx) {
        if (type === 'drum') return drumPat[idx].some(v => v);
        if (type === 'melody') return melPat[idx].some(s => s.some(n => n));
        return vocalPat.some(v => v);
    }

    function restoreOriginalBuffer() {
        if (browserType === 'drum') {
            if (drumSampleData[browserIdx]?.data) {
                audioCtx.decodeAudioData(drumSampleData[browserIdx].data.slice(0)).then(b => drumBuf[browserIdx] = b).catch(() => {});
            } else drumBuf[browserIdx] = null;
        } else if (browserType === 'melody') {
            if (melSampleData[browserIdx]?.data) {
                audioCtx.decodeAudioData(melSampleData[browserIdx].data.slice(0)).then(b => melBuf[browserIdx] = b).catch(() => {});
            } else melBuf[browserIdx] = null;
        } else {
            if (vocalSampleData?.data) {
                audioCtx.decodeAudioData(vocalSampleData.data.slice(0)).then(b => vocalBuf = b).catch(() => {});
            } else vocalBuf = null;
        }
    }

    async function confirmBrowserLoad() {
        if (browserSelected === null) return;
        const item = browserItems[browserSelected];
        try {
            const { buffer, data } = await fetchAndDecode(item.path);
            const fname = item.name + '.wav';
            if (browserType === 'drum') {
                drumBuf[browserIdx] = buffer;
                drumSampleData[browserIdx] = { name: fname, data };
            } else if (browserType === 'melody') {
                melBuf[browserIdx] = buffer;
                melSampleData[browserIdx] = { name: fname, data };
            } else {
                vocalBuf = buffer;
                vocalSampleData = { name: fname, data };
            }
            updateSampleBtn(browserType, browserIdx, fname);
            scheduleSave();
            closeBrowser();
        } catch(e) { console.error('Load failed:', e); }
    }

    // ═══════════════════════════════════════════
    //  SAMPLE LOADING (fallback + drag drop)
    // ═══════════════════════════════════════════
    function loadSampleFallback(type, idx) {
        const input=document.createElement('input');input.type='file';input.accept='audio/*';
        input.onchange=async(e)=>{const file=e.target.files[0];if(!file)return;try{const res=await loadAudioFile(file);if(type==='drum'){drumBuf[idx]=res.buffer;drumSampleData[idx]={name:res.name,data:res.data};}else if(type==='melody'){melBuf[idx]=res.buffer;melSampleData[idx]={name:res.name,data:res.data};}else{vocalBuf=res.buffer;vocalSampleData={name:res.name,data:res.data};}updateSampleBtn(type,idx,res.name);scheduleSave();}catch(err){console.error('Load failed:',err);}};
        input.click();
    }
    function updateSampleBtn(type,idx,name){
        let sel;
        if(type==='drum')sel=`.melody-track[data-type="drum"][data-track="${idx}"] .sample-btn`;
        else if(type==='melody')sel=`.melody-track[data-type="melody"][data-track="${idx}"] .sample-btn`;
        else sel=`.melody-track[data-type="vocal"] .sample-btn`;
        const btn=document.querySelector(sel);if(!btn)return;
        btn.textContent=truncName(name);btn.title=name;btn.classList.add('loaded');
    }
    function setupDragDrop(elem,type,idx){
        elem.addEventListener('dragover',(e)=>{e.preventDefault();e.dataTransfer.dropEffect='copy';elem.classList.add('drag-over');});
        elem.addEventListener('dragleave',()=>elem.classList.remove('drag-over'));
        elem.addEventListener('drop',async(e)=>{e.preventDefault();elem.classList.remove('drag-over');const file=e.dataTransfer.files[0];if(!file)return;try{const res=await loadAudioFile(file);if(type==='drum'){drumBuf[idx]=res.buffer;drumSampleData[idx]={name:res.name,data:res.data};}else if(type==='melody'){melBuf[idx]=res.buffer;melSampleData[idx]={name:res.name,data:res.data};}else{vocalBuf=res.buffer;vocalSampleData={name:res.name,data:res.data};}updateSampleBtn(type,idx,res.name);scheduleSave();}catch(err){console.error('Drop failed:',err);}});
    }

    // ═══════════════════════════════════════════
    //  TRACK CONTROLS
    // ═══════════════════════════════════════════
    function toggleMute(gi,btn){mutedArr[gi]=!mutedArr[gi];btn.classList.toggle('muted',mutedArr[gi]);scheduleSave();}
    function changeOctave(ti,d){octaves[ti]=Math.max(1,Math.min(7,octaves[ti]+d));document.querySelector(`.melody-track[data-track="${ti}"] .oct-val`).textContent=octaves[ti];scheduleSave();}
    function clearTrack(type,idx){if(type==='drum'){drumPat[idx].fill(false);for(let s=0;s<STEPS;s++)updateDrumCell(idx,s);}else if(type==='melody'){for(let s=0;s<STEPS;s++){melPat[idx][s].fill(false);for(let n=0;n<12;n++)updateMelCell(idx,s,n);}}else{vocalPat.fill(false);for(let s=0;s<STEPS;s++)updateVocalCell(s);}updateSongPane();scheduleSave();}

    function makeEditable(nameEl,getName,setName){
        nameEl.addEventListener('dblclick',()=>{const input=document.createElement('input');input.type='text';input.className='track-name-input';input.value=getName();nameEl.replaceWith(input);input.focus();input.select();const commit=()=>{const val=input.value.trim()||getName();setName(val);const ne=el('div','track-name');ne.textContent=val;ne.title=val;input.replaceWith(ne);makeEditable(ne,getName,setName);scheduleSave();};input.addEventListener('blur',commit);input.addEventListener('keydown',(e)=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=getName();input.blur();}});});
    }

    // Save/Load file
    function savePatternFile(){const data=collectSongData(currentSongName);delete data.id;delete data.updatedAt;const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=currentSongName.replace(/[^a-zA-Z0-9-_ ]/g,'')+'.json';a.click();URL.revokeObjectURL(a.href);}
    function loadPatternFile(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async(e)=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());await loadSong({...data,id:currentSongId});refreshUI();scheduleSave();}catch(err){console.error('Load failed:',err);}};input.click();}

    // Painting
    function setupPainting(){
        document.addEventListener('mousedown',(e)=>{
            if(e.button!==0)return;const cell=e.target.closest('.step-cell,.melody-cell');if(!cell)return;e.preventDefault();
            const type=cell.dataset.type,t=+cell.dataset.track,s=+cell.dataset.step;
            if(e.shiftKey&&type==='melody'&&!MEL_CFG[t].mono){selecting=true;selection={track:t,start:s,end:s};updateSelectionVisuals();return;}
            if(selection.track>=0)clearSelection();
            painting=true;paintType=type;
            if(type==='drum'){paintVal=!drumPat[t][s];drumPat[t][s]=paintVal;updateDrumCell(t,s);}
            else if(type==='melody'){const dr=+cell.dataset.note;const semi=displayToSemitone(dr);paintVal=!melPat[t][s][semi];setMelodyCell(t,s,dr,paintVal);}
            else{paintVal=!vocalPat[s];vocalPat[s]=paintVal;updateVocalCell(s);}
            scheduleSave();
        });
        document.addEventListener('mousemove',(e)=>{
            if(selecting){const cell=e.target.closest('.melody-cell');if(!cell||+cell.dataset.track!==selection.track)return;selection.end=+cell.dataset.step;updateSelectionVisuals();return;}
            if(!painting)return;const cell=e.target.closest('.step-cell,.melody-cell');if(!cell||cell.dataset.type!==paintType)return;
            const t=+cell.dataset.track,s=+cell.dataset.step;
            if(paintType==='drum'){if(drumPat[t][s]!==paintVal){drumPat[t][s]=paintVal;updateDrumCell(t,s);}}
            else if(paintType==='melody'){const dr=+cell.dataset.note;const semi=displayToSemitone(dr);if(melPat[t][s][semi]!==paintVal)setMelodyCell(t,s,dr,paintVal);}
            else{if(vocalPat[s]!==paintVal){vocalPat[s]=paintVal;updateVocalCell(s);}}
        });
        document.addEventListener('mouseup',()=>{if(selecting){selecting=false;if(selection.start>selection.end)[selection.start,selection.end]=[selection.end,selection.start];updateRepButtons();return;}if(painting){painting=false;updateSongPane();scheduleSave();}});
    }

    // Song management
    function refreshSongName(){const el=document.getElementById('song-name');if(el){el.textContent=currentSongName;el.title=currentSongName+' (double-click to rename)';}}
    async function switchSong(id){if(id===currentSongId)return;await saveSong();const song=await dbGet('songs',id);if(!song)return;if(playing)stopPlayback();await loadSong(song);refreshUI();refreshSongName();await dbPut('meta',currentSongId,'currentSongId');}
    async function newSong(){await saveSong();if(playing)stopPlayback();
        for(let pi=0;pi<NUM_PHRASES;pi++){const p=phrases[pi];p.drumPat.forEach(r=>r.fill(false));p.melPat.forEach(t=>t.forEach(s=>s.fill(false)));p.vocalPat.fill(false);}
        currentPhrase=0;drumPat=phrases[0].drumPat;melPat=phrases[0].melPat;vocalPat=phrases[0].vocalPat;
        octaves.fill(3);harmonies.fill(0);drumNames.splice(0,drumNames.length,...DEFAULT_DRUM_NAMES);melNames.splice(0,melNames.length,...DEFAULT_MEL_NAMES);vocalName=DEFAULT_VOCAL_NAME;mutedArr.fill(false);drumBuf.fill(null);melBuf.fill(null);vocalBuf=null;drumSampleData.fill(null);melSampleData.fill(null);vocalSampleData=null;bpm=120;currentSongId=genId();currentSongName='Untitled';await saveSong();refreshUI();refreshSongName();updateSongPane();}
    async function deleteSong(){if(!confirm('Delete this song?'))return;await dbDelete('songs',currentSongId);const songs=await dbGetAll('songs');if(songs.length>0){await loadSong(songs[songs.length-1]);refreshUI();refreshSongName();}else{await newSong();return;}await dbPut('meta',currentSongId,'currentSongId');}

    // ═══════════════════════════════════════════
    //  BUILD UI
    // ═══════════════════════════════════════════
    function buildStepGrid(container,cells,type,trackIdx){
        const grid=el('div','step-grid');
        for(let bar=0;bar<BARS;bar++){const bg=el('div','bar-group');for(let l=0;l<SPB;l++){const s=bar*SPB+l;const c=el('div','step-cell'+(l%4===0?' beat-hi':'')+(l>0&&l%4===0?' beat-gap':''));c.dataset.type=type;c.dataset.track=trackIdx;c.dataset.step=s;cells[s]=c;bg.appendChild(c);}grid.appendChild(bg);}
        container.appendChild(grid);
    }

    function buildUI(){
        const app=document.getElementById('app');
        // Transport
        const transport=el('div','transport');
        transport.innerHTML=`
            <div class="transport-btns"><button class="tb" id="play-btn" title="Play (Space)"><svg width="8" height="10" viewBox="0 0 14 16" fill="none"><path d="M1 1.5L13 8L1 14.5V1.5Z" fill="currentColor"/></svg></button><button class="tb" id="stop-btn" title="Stop"><svg width="7" height="7" viewBox="0 0 12 12" fill="none"><rect width="12" height="12" rx="1.5" fill="currentColor"/></svg></button></div>
            <div class="song-ctrl"><div id="song-name" class="song-name" title="Double-click to rename">Untitled</div><div class="song-btns"><button class="tb" id="song-new" title="New Song"><svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="tb" id="song-del" title="Delete Song"><svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M5.5 4.5V3a1 1 0 011-1h3a1 1 0 011 1v1.5M4.5 4.5l.7 8.5a1 1 0 001 .9h3.6a1 1 0 001-.9l.7-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
            <div class="file-btns"><button class="tb" id="save-btn" title="Export Pattern"><svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3 3 3-3M3 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="tb" id="load-btn" title="Import Pattern"><svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M8 10V2M5 5l3-3 3 3M3 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
            <div class="bpm-ctrl"><label>BPM</label><input type="range" id="bpm-range" min="40" max="220" value="${bpm}"><input type="number" id="bpm-num" min="40" max="220" value="${bpm}"></div>
            <div class="ext-icons" id="ext-icons"></div>`;
        app.appendChild(transport);

        // Drums
        const drumsSec=el('div','section');
        /* section heading removed */
        DRUMS_CFG.forEach((cfg,ti)=>{
            const panel=el('div','melody-track');panel.dataset.track=ti;panel.dataset.type='drum';
            const header=el('div','melody-track-header');
            const cb=el('div','track-color');cb.style.background=cfg.color;header.appendChild(cb);
            const nm=el('div','track-name');nm.textContent=drumNames[ti];nm.title=drumNames[ti];header.appendChild(nm);
            makeEditable(nm,()=>drumNames[ti],v=>{drumNames[ti]=v;});
            const sb=el('button','sample-btn');sb.textContent='LOAD';sb.onclick=()=>openBrowser('drum',ti);header.appendChild(sb);
            const fill=el('button','fill-btn');fill.textContent='FILL';fill.onclick=()=>replicateTrack('drum',ti);header.appendChild(fill);
            const clr=el('button','clear-btn');clr.textContent='CLR';clr.onclick=()=>clearTrack('drum',ti);header.appendChild(clr);
            const mb=el('button','mute-btn');mb.textContent='M';mb.onclick=()=>toggleMute(ti,mb);header.appendChild(mb);
            panel.appendChild(header);
            const gw=el('div','single-grid-wrapper');
            drumCells[ti]=[];buildStepGrid(gw,drumCells[ti],'drum',ti);
            panel.appendChild(gw);setupDragDrop(panel,'drum',ti);drumsSec.appendChild(panel);
        });
        app.appendChild(drumsSec);

        // Melody
        const melSec=el('div','section');
        /* section heading removed */
        MEL_CFG.forEach((cfg,ti)=>{
            const panel=el('div','melody-track');panel.dataset.track=ti;panel.dataset.type='melody';
            const header=el('div','melody-track-header');
            const cb=el('div','track-color');cb.style.background=cfg.color;header.appendChild(cb);
            const nm=el('div','track-name');nm.textContent=melNames[ti];nm.title=melNames[ti];header.appendChild(nm);
            makeEditable(nm,()=>melNames[ti],v=>{melNames[ti]=v;});
            if(!cfg.mono){const ht=el('button','harmony-toggle');ht.textContent='HARM: '+HARMONY_LABELS[harmonies[ti]];ht.classList.toggle('active',harmonies[ti]>0);ht.onclick=()=>cycleHarmony(ti);header.appendChild(ht);}
            const sb=el('button','sample-btn');sb.textContent='LOAD';sb.onclick=()=>openBrowser('melody',ti);header.appendChild(sb);
            const fill=el('button','fill-btn');fill.textContent='FILL';fill.onclick=()=>replicateTrack('melody',ti);header.appendChild(fill);
            const clr=el('button','clear-btn');clr.textContent='CLR';clr.onclick=()=>clearTrack('melody',ti);header.appendChild(clr);
            const mb=el('button','mute-btn');mb.textContent='M';mb.onclick=()=>toggleMute(DRUMS_CFG.length+ti,mb);header.appendChild(mb);
            const oc=el('div','octave-ctrl');const ol=el('label','');ol.textContent='OCT';oc.appendChild(ol);const od=el('button','');od.textContent='\u2212';od.onclick=()=>changeOctave(ti,-1);oc.appendChild(od);const ov=el('span','oct-val');ov.textContent=octaves[ti];oc.appendChild(ov);const ou=el('button','');ou.textContent='+';ou.onclick=()=>changeOctave(ti,1);oc.appendChild(ou);header.appendChild(oc);
            panel.appendChild(header);
            const wrapper=el('div','melody-grid-wrapper');const labels=el('div','note-labels');NOTES_DISPLAY.forEach((note,di)=>{const l=el('div','note-label'+(SHARPS.has(di)?' sharp':''));l.textContent=note;labels.appendChild(l);});wrapper.appendChild(labels);
            const grid=el('div','melody-grid');melCells[ti]=[];for(let s=0;s<STEPS;s++)melCells[ti][s]=[];
            NOTES_DISPLAY.forEach((note,di)=>{const row=el('div','melody-row');const isSharp=SHARPS.has(di);for(let bar=0;bar<BARS;bar++){const bg=el('div','bar-group');for(let l=0;l<SPB;l++){const s=bar*SPB+l;const c=el('div','melody-cell'+(isSharp?' black-key':' white-key')+(l%4===0?' beat-hi':'')+(l>0&&l%4===0?' beat-gap':''));c.dataset.type='melody';c.dataset.track=ti;c.dataset.step=s;c.dataset.note=di;melCells[ti][s][di]=c;bg.appendChild(c);}row.appendChild(bg);}grid.appendChild(row);});
            wrapper.appendChild(grid);panel.appendChild(wrapper);setupDragDrop(panel,'melody',ti);melSec.appendChild(panel);
        });
        app.appendChild(melSec);

        // Sample
        const vocSec=el('div','section'); /* section heading removed */
        const vpanel=el('div','melody-track');vpanel.dataset.type='vocal';
        const vheader=el('div','melody-track-header');
        const vcb=el('div','track-color');vcb.style.background=VOCAL_CFG.color;vheader.appendChild(vcb);
        const vnm=el('div','track-name');vnm.textContent=vocalName;vnm.title=vocalName;vheader.appendChild(vnm);makeEditable(vnm,()=>vocalName,v=>{vocalName=v;});
        const vsb=el('button','sample-btn');vsb.textContent='LOAD';vsb.onclick=()=>openBrowser('vocal',0);vheader.appendChild(vsb);
        const vfill=el('button','fill-btn');vfill.textContent='FILL';vfill.onclick=()=>replicateTrack('vocal',0);vheader.appendChild(vfill);
        const vclr=el('button','clear-btn');vclr.textContent='CLR';vclr.onclick=()=>clearTrack('vocal',0);vheader.appendChild(vclr);
        const vmb=el('button','mute-btn');vmb.textContent='M';vmb.onclick=()=>toggleMute(DRUMS_CFG.length+MEL_CFG.length,vmb);vheader.appendChild(vmb);
        vpanel.appendChild(vheader);
        const vgw=el('div','single-grid-wrapper');
        vocalCells=[];buildStepGrid(vgw,vocalCells,'vocal',0);
        vpanel.appendChild(vgw);setupDragDrop(vpanel,'vocal',0);vocSec.appendChild(vpanel);app.appendChild(vocSec);


        // Wire
        document.getElementById('play-btn').onclick=togglePlay;
        document.getElementById('stop-btn').onclick=stopPlayback;
        document.getElementById('save-btn').onclick=savePatternFile;
        document.getElementById('load-btn').onclick=loadPatternFile;
        document.getElementById('song-new').onclick=newSong;
        document.getElementById('song-del').onclick=deleteSong;
        function setupSongNameEdit(elem){
            elem.addEventListener('dblclick',()=>{
                const input=document.createElement('input');
                input.type='text';input.className='song-name-input';
                input.value=currentSongName;
                elem.replaceWith(input);input.focus();input.select();
                const commit=async()=>{
                    currentSongName=input.value.trim()||'Untitled';
                    const newEl=document.createElement('div');
                    newEl.id='song-name';newEl.className='song-name';
                    newEl.textContent=currentSongName;
                    newEl.title=currentSongName+' (double-click to rename)';
                    input.replaceWith(newEl);
                    setupSongNameEdit(newEl);
                    await saveSong();
                };
                input.addEventListener('blur',commit);
                input.addEventListener('keydown',(ev)=>{if(ev.key==='Enter')input.blur();if(ev.key==='Escape'){input.value=currentSongName;input.blur();}});
            });
        }
        setupSongNameEdit(document.getElementById('song-name'));
        const br=document.getElementById('bpm-range'),bn=document.getElementById('bpm-num');
        br.oninput=()=>{bpm=+br.value;bn.value=bpm;scheduleSave();};
        bn.onchange=()=>{bpm=Math.max(40,Math.min(220,+bn.value));br.value=bpm;bn.value=bpm;scheduleSave();};
        document.addEventListener('keydown',(e)=>{
            if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();togglePlay();}
            if(e.code==='Escape'){if(document.getElementById('browser-overlay').classList.contains('open'))closeBrowser();else clearSelection();}
        });

        // Browser events
        document.getElementById('browser-close').onclick = closeBrowser;
        document.getElementById('browser-overlay').addEventListener('click', (e) => { if(e.target === e.currentTarget) closeBrowser(); });
        document.getElementById('browser-search').oninput = (e) => renderBrowserList(e.target.value);
        document.getElementById('browser-load').onclick = confirmBrowserLoad;

        // ── Song Pane (phrases) ──
        const songPane = el('div','');
        songPane.id = 'song-pane';
        for (let i = 0; i < NUM_PHRASES; i++) {
            const slot = el('div','phrase-slot'+(i===0?' active':''));
            slot.dataset.phrase = i;
            const num = el('span','phrase-num'); num.textContent = i+1;
            const dot = el('span','phrase-dot');
            slot.appendChild(num); slot.appendChild(dot);
            slot.addEventListener('click', (e) => {
                if (e.target.classList.contains('phrase-fill-btn')) return;
                switchToPhrase(i);
            });
            slot.addEventListener('dblclick', (e) => {
                if (e.target.classList.contains('phrase-fill-btn')) return;
                if (playing) { playingPhrase = i; curStep = 0; if(prevVisualStep>=0){clearHL(prevVisualStep);prevVisualStep=-1;} updateSongPane(); }
            });
            if (i > 0) {
                const fb = el('button','phrase-fill-btn');
                fb.textContent = '\u2190';
                fb.title = 'Fill with previous phrase';
                fb.addEventListener('click', (e) => { e.stopPropagation(); fillWithPrev(i); });
                slot.appendChild(fb);
            }
            songPane.appendChild(slot);
        }
        document.body.appendChild(songPane);

        setupPainting();
    }

    function updateSongPane() {
        const slots = document.querySelectorAll('.phrase-slot');
        slots.forEach((slot, i) => {
            slot.classList.toggle('active', i === currentPhrase);
            slot.classList.toggle('has-content', !isPhraseEmpty(i));
            slot.classList.toggle('playing-phrase', playing && i === playingPhrase);
        });
    }

    // ═══════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════
    async function init(){
        buildUI();
        await Promise.all([openDB(), loadManifest()]);
        // Init extensions
        initAudio();
        if (SEQ_EXTENSIONS.length > 0) rebuildAudioChain();
        buildExtIcons();
        document.getElementById('ext-panel-close').onclick = () => toggleExtension(activeExtensionId);
        // Load song
        const lastId=await dbGet('meta','currentSongId');
        let song=lastId?await dbGet('songs',lastId):null;
        if(!song){currentSongId=genId();await saveSong();song=await dbGet('songs',currentSongId);}
        if(song){await loadSong(song);refreshUI();refreshSongName();updateSongPane();}
    }
    // init() is called after extension scripts load (see below)
    </script>
