<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DSP Benchmark — Stress Test</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; color:#ddd; font-family:monospace; font-size:13px; padding:24px; }
  h1 { font-size:16px; color:#fff; margin-bottom:8px; letter-spacing:2px; }
  .subtitle { color:#666; font-size:11px; margin-bottom:24px; }
  button { background:#222; border:1px solid #444; color:#ddd; padding:8px 20px;
    border-radius:4px; cursor:pointer; font-family:inherit; font-size:12px; margin-bottom:16px; }
  button:hover { background:#333; }
  button.running { border-color:rgba(74,254,112,0.4); color:#4afe70; }
  .config { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .config label { font-size:10px; color:#888; letter-spacing:1px; }
  .config select { background:#222; border:1px solid #333; color:#ddd; padding:4px;
    border-radius:3px; font-family:inherit; font-size:11px; margin-top:4px; display:block; }
  .results { margin-top:16px; }
  .metric { display:flex; align-items:baseline; gap:12px; padding:8px 0;
    border-bottom:1px solid #222; }
  .metric-name { font-size:10px; color:#888; letter-spacing:1px; min-width:140px; }
  .metric-value { font-size:18px; font-weight:800; }
  .metric-unit { font-size:10px; color:#666; }
  .pass { color:#4afe70; }
  .fail { color:#ff3c5a; }
  .warn { color:#EEA83E; }
  .meter { margin-top:16px; }
  .meter-bar { height:8px; background:#1a1a1a; border-radius:4px; overflow:hidden; margin-top:4px; }
  .meter-fill { height:100%; border-radius:4px; transition:width 0.3s, background 0.3s; }
  .meter-label { font-size:9px; color:#666; margin-top:2px; }
  .history { margin-top:24px; border:1px solid #222; border-radius:6px; overflow:hidden; }
  .history-header { background:#1a1a1a; padding:6px 12px; font-size:10px; color:#888; letter-spacing:1px; }
  canvas { width:100%; height:120px; display:block; background:#111; }
  .gate { margin-top:24px; padding:16px; border-radius:6px; font-size:14px; }
  .gate.pass { background:rgba(74,254,112,0.06); border:1px solid rgba(74,254,112,0.3); }
  .gate.fail { background:rgba(255,60,90,0.06); border:1px solid rgba(255,60,90,0.3); }
</style>
</head>
<body>
<h1>DSP BENCHMARK &mdash; STRESS TEST</h1>
<div class="subtitle">Measures real AudioWorklet process() duration under maximum load via MeasureProcessor. Reports p99 latency.</div>

<div class="config">
  <div>
    <label>BUFFER SIZE</label>
    <select id="buf-size">
      <option value="128">128</option>
      <option value="256" selected>256</option>
      <option value="512">512</option>
    </select>
  </div>
  <div>
    <label>POLYPHONY</label>
    <select id="polyphony">
      <option value="4">4 voices</option>
      <option value="8">8 voices</option>
      <option value="16" selected>16 voices</option>
      <option value="32">32 voices</option>
    </select>
  </div>
  <div>
    <label>DURATION</label>
    <select id="duration">
      <option value="5">5 seconds</option>
      <option value="10" selected>10 seconds</option>
      <option value="30">30 seconds</option>
    </select>
  </div>
</div>

<button id="run-btn">RUN STRESS TEST</button>

<div class="results" id="results" style="display:none">
  <div class="metric">
    <span class="metric-name">BUDGET PER BLOCK</span>
    <span class="metric-value" id="budget">&mdash;</span>
    <span class="metric-unit">ms</span>
  </div>
  <div class="metric">
    <span class="metric-name">P50 (MEDIAN)</span>
    <span class="metric-value" id="p50">&mdash;</span>
    <span class="metric-unit">ms</span>
  </div>
  <div class="metric">
    <span class="metric-name">P99</span>
    <span class="metric-value" id="p99">&mdash;</span>
    <span class="metric-unit">ms</span>
  </div>
  <div class="metric">
    <span class="metric-name">MAX</span>
    <span class="metric-value" id="max">&mdash;</span>
    <span class="metric-unit">ms</span>
  </div>
  <div class="metric">
    <span class="metric-name">DSP LOAD (P99)</span>
    <span class="metric-value" id="load">&mdash;</span>
    <span class="metric-unit">%</span>
  </div>

  <div class="meter">
    <div class="meter-bar"><div class="meter-fill" id="load-fill" style="width:0%"></div></div>
    <div class="meter-label">DSP load &mdash; green &lt;50%, amber 50-75%, red &gt;75%</div>
  </div>

  <div class="history">
    <div class="history-header">PROCESS() DURATION OVER TIME (ms)</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="gate" id="gate"></div>
</div>

<script>
const SAMPLE_RATE = 48000;

/**
 * MeasureProcessor — real AudioWorklet that times its own process() calls.
 * Defined as inline Blob URL so the benchmark is self-contained.
 * Sits at the end of the DSP chain, passes audio through, and measures
 * elapsed compute time inside each process() callback.
 */
const MEASURE_PROCESSOR_CODE = `
class MeasureProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._active = true;
    this._lastFrame = null;
    this.port.onmessage = (e) => {
      if (e.data === 'stop') this._active = false;
    };
  }

  process(inputs, outputs) {
    if (!this._active) return false;

    const hasPerf = typeof performance !== 'undefined' && performance && typeof performance.now === 'function';
    const t0 = hasPerf ? performance.now() : 0;

    // Pass audio through (input to output) so the chain stays connected
    const input = inputs[0];
    const output = outputs[0];
    if (input && output) {
      for (let ch = 0; ch < output.length; ch++) {
        const inCh = input[ch];
        const outCh = output[ch];
        if (inCh && outCh) {
          outCh.set(inCh);
        }
      }
    }

    if (hasPerf) {
      const t1 = performance.now();
      this.port.postMessage(t1 - t0);
      return true;
    }

    // Fallback when high-resolution timer is unavailable in worklet scope:
    // use render-frame interval timing to avoid zero/false-pass samples.
    if (this._lastFrame === null) {
      this._lastFrame = currentFrame;
      return true;
    }
    const elapsed = ((currentFrame - this._lastFrame) / sampleRate) * 1000;
    this._lastFrame = currentFrame;
    this.port.postMessage(elapsed);

    return true;
  }
}

registerProcessor('measure-processor', MeasureProcessor);
`;

async function runBenchmark() {
  const bufSize = Number(document.getElementById('buf-size').value);
  const voices = Number(document.getElementById('polyphony').value);
  const duration = Number(document.getElementById('duration').value);
  const budget = (bufSize / SAMPLE_RATE) * 1000; // ms

  const btn = document.getElementById('run-btn');
  btn.textContent = 'RUNNING...';
  btn.classList.add('running');

  document.getElementById('results').style.display = 'block';
  document.getElementById('budget').textContent = budget.toFixed(2);

  // Create real AudioContext for accurate worklet timing
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.state === 'suspended') await ctx.resume();

  // Register the MeasureProcessor worklet from Blob URL
  const blob = new Blob([MEASURE_PROCESSOR_CODE], { type: 'application/javascript' });
  const workletUrl = URL.createObjectURL(blob);
  await ctx.audioWorklet.addModule(workletUrl);
  URL.revokeObjectURL(workletUrl);

  // Build stress chain: N voices -> saturation -> compressor -> MeasureProcessor -> output
  const masterGain = ctx.createGain();
  masterGain.gain.value = 0.3 / Math.sqrt(voices); // normalize
  masterGain.connect(ctx.destination);

  // Saturation (4x oversampled waveshaper)
  const sat = ctx.createWaveShaper();
  const n = 4096;
  const curve = new Float32Array(n);
  const amount = 0.5;
  const k = 1 + amount * 50;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    const shaped = (Math.PI + k) * x / (Math.PI + k * Math.abs(x));
    curve[i] = x * (1 - amount) + shaped * amount;
  }
  sat.curve = curve;
  sat.oversample = '4x';

  // Compressor (native node)
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24;
  comp.ratio.value = 4;
  comp.knee.value = 20;

  // MeasureProcessor — real AudioWorkletNode that times its own process()
  const measureNode = new AudioWorkletNode(ctx, 'measure-processor');

  // Chain: voices -> sat -> comp -> measureNode -> master -> destination
  sat.connect(comp);
  comp.connect(measureNode);
  measureNode.connect(masterGain);

  // Spawn voices — deterministic frequencies (no randomness)
  const oscs = [];
  for (let v = 0; v < voices; v++) {
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 55 + v * 7.3 + ((v * 1.37) % 2); // deterministic detuning
    const g = ctx.createGain();
    g.gain.value = 0.15;
    osc.connect(g).connect(sat);
    osc.start();
    oscs.push(osc);
  }

  // Collect direct per-process elapsed timings emitted from the worklet.
  const timings = [];
  let processorError = null;
  measureNode.onprocessorerror = () => {
    processorError = 'AudioWorklet processor error';
  };
  measureNode.port.onmessage = (e) => {
    if (e.data && e.data.type === 'error') {
      processorError = String(e.data.reason || 'AudioWorklet processor error');
      return;
    }
    const v = Number(e.data);
    if (Number.isFinite(v) && v >= 0) {
      timings.push(v);
    }
  };

  // Wait for test duration
  await new Promise(r => setTimeout(r, duration * 1000));

  // Stop worklet and oscillators
  measureNode.port.postMessage('stop');
  oscs.forEach(o => { try { o.stop(); } catch(e) {} });

  // Small delay to collect final batch
  await new Promise(r => setTimeout(r, 200));
  ctx.close();

  // Analyze results from real worklet process() timing
  if (processorError) {
    document.getElementById('gate').className = 'gate fail';
    document.getElementById('gate').textContent = 'FAIL — ' + processorError;
    btn.textContent = 'RUN STRESS TEST';
    btn.classList.remove('running');
    return;
  }

  const data = timings;
  if (data.length < 10) {
    document.getElementById('gate').className = 'gate fail';
    document.getElementById('gate').textContent = 'FAIL — insufficient data collected (' + data.length + ' samples)';
    btn.textContent = 'RUN STRESS TEST';
    btn.classList.remove('running');
    return;
  }

  const sorted = [...data].sort((a, b) => a - b);
  const p50 = sorted[Math.floor(sorted.length * 0.5)];
  const p99 = sorted[Math.floor(sorted.length * 0.99)];
  const max = sorted[sorted.length - 1];
  const loadPct = (p99 / budget) * 100;

  document.getElementById('p50').textContent = p50.toFixed(3);
  document.getElementById('p99').textContent = p99.toFixed(3);
  document.getElementById('max').textContent = max.toFixed(3);
  document.getElementById('load').textContent = loadPct.toFixed(1);

  // Color code
  const p99El = document.getElementById('p99');
  p99El.className = 'metric-value ' + (p99 < budget * 0.5 ? 'pass' : p99 < budget * 0.75 ? 'warn' : 'fail');
  const loadEl = document.getElementById('load');
  loadEl.className = 'metric-value ' + (loadPct < 50 ? 'pass' : loadPct < 75 ? 'warn' : 'fail');

  // Load meter
  const fill = document.getElementById('load-fill');
  fill.style.width = Math.min(100, loadPct) + '%';
  fill.style.background = loadPct < 50 ? '#4afe70' : loadPct < 75 ? '#EEA83E' : '#ff3c5a';

  // Chart
  drawChart(data, budget);

  // Gate verdict — in interactive profile, p99 must be under budget
  const gate = document.getElementById('gate');
  const passed = p99 < budget;
  gate.className = 'gate ' + (passed ? 'pass' : 'fail');
  gate.textContent = (passed ? 'PASS' : 'FAIL')
    + ' — p99 ' + p99.toFixed(3) + 'ms'
    + ', budget ' + budget.toFixed(2) + 'ms'
    + ', ' + data.length + ' worklet process() samples'
    + ', p50 ' + p50.toFixed(3) + 'ms';

  btn.textContent = 'RUN STRESS TEST';
  btn.classList.remove('running');
}

function drawChart(data, budget) {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0, 0, w, h);

  // Budget line
  const maxVal = Math.max(budget * 1.5, ...data);
  const budgetY = h - (budget / maxVal) * h;

  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = '#EEA83E';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, budgetY);
  ctx.lineTo(w, budgetY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#EEA83E';
  ctx.font = '8px monospace';
  ctx.fillText('BUDGET ' + budget.toFixed(1) + 'ms', 4, budgetY - 3);

  // Data
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = (i / data.length) * w;
    const y = h - (data[i] / maxVal) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#5CDCC8';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Fill under budget violations
  for (let i = 0; i < data.length; i++) {
    const x = (i / data.length) * w;
    const y = h - (data[i] / maxVal) * h;
    if (data[i] > budget) {
      ctx.fillStyle = 'rgba(255,60,90,0.3)';
      ctx.fillRect(x - 0.5, y, 1, budgetY - y);
    }
  }
}

document.getElementById('run-btn').onclick = runBenchmark;
</script>
</body>
</html>
